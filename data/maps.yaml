# Regolith's map layouts
#
# A map is a layout of hex tiles: 7-hex flowers, the planet and the six spaces around it, so all six
# spaces of a tile are its planet's orbit. A layout is read as rows of tiles where each odd row (the
# 2nd, 4th…) sits half a tile to the right, between the tiles of the rows above and below: a tile
# touches the two tiles beside it and two in each neighbouring row (docs/HEX.md).
#
# Layout tokens (space-separated, one string per tile row):
#   7 | 8 | 9 | 10   planet tile; number = conquer target and cube locations (7→1, 8→2, 9→3, 10→4)
#   0                void tile: no planet; +1 research per own ship on it at start of turn
#   -                blank tile: open ground, no planet and no research
#   .                no tile (empty gap, not part of the board)
#   suffix n ne se s sw nw
#                    the planet sits off the middle of its tile, on that hex (north is up as drawn)
#   suffix *         starting planet, after any direction: 8*, 7ne*
#
# An off-centre planet's orbit is still the spaces next to it, so it reaches onto the tiles it faces,
# loses spaces off the map's edge, and may overlap another planet's: a ship there counts for both. Each
# starting planet needs 3 orbital spaces no other start shares.
#
# Groups: hex (the basic and advanced maps), open (maps spread out with blank tiles),
#         drift (planets off the middle of their tiles), prepared (maps that start with an Ice Tunnel or
#         barriers already on the ground).
#
# start: what the map starts with on the ground, optional. A space is named `row:col:side`, the layout's tile row
#   and the tile's place in its row (counting its gaps), then the tile's space: n ne se s sw nw round its middle,
#   or m for the middle itself (on an Alien Artefact or blank tile; an objective in the middle leaves no space there).
#     tunnel:   [space, space]   an Ice Tunnel, open from the first turn (the Ice Tunnel tactic still moves it)
#     wormhole: [space, space]   a pair linked like the tunnel's but for good: the tactic can't close it or land on it
#     barriers: [space, …]       barriers nobody fired, like the Wisp's (only Kinetic Shunt moves one)
#   `npm run map:show -- <id>` prints a map with every space named, and lays a symmetric list (--spin).
#
# length: short | medium | long, on every map: AI self-play's rounds times players (level 2, `npm run selfplay:maps`),
#   under 30 turns, up to 50, over 50. The lobby lists maps by it.
#
# world: phobos | deimos | mars, on every map. The surface the map lies on, which its tiles show. Phobos is
#   grey and cratered; Deimos, the outer moon, redder and smoother, its craters buried under dust; Mars has
#   dunes and dust devils' tracks.
#
# Stats, all derivable from layout + cubes + player count (mapStats(), kept in step by maps.test.ts):
#   slack   = total cube locations − players × cubes
#   planets = planets that still have an empty location after setup
#   shared  = how many of those must be shared if everyone placed all their cubes

maps:
  - id: alpha-hex
    name: Alpha Sector
    players: 2
    group: hex
    world: phobos
    length: short
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    layout:
      - ".  7*"
      - "7  7"
      - "7  8  7"
      - "7  7"
      - ".  7*"

  - id: beta-hex
    name: Beta Sector
    players: 3
    group: hex
    world: deimos
    length: medium
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 10 }
    layout:
      - "8* 7  8  8*"
      - "8  10 7"
      - ".  7  8"
      - ".  8*"

  - id: gamma-hex
    name: Gamma Sector
    players: 4
    group: hex
    world: phobos
    length: long
    cubes: 5
    stats: { slack: 4, shared: 5, planets: 9 }
    layout:
      - ".  9*"
      - "9  8"
      - "8* 10 8*"
      - "8  9"
      - ".  9*"

  # Hex: advanced maps, each with an idea (where the starts sit, what they touch, a void or a gap in the middle).
  # Their seats match by a half turn (a third of a turn for 3 players), as hex maps can't be mirrored.

  - id: terra-minor-hex
    name: Terra Minor
    players: 2
    group: hex
    world: mars
    length: medium
    cubes: 7
    stats: { slack: 0, shared: 6, planets: 6 }
    # A band of six 8s, a start at each end touching two of them.
    layout:
      - "8  8"
      - "7* 8  8  7*"
      - ".  8  8"

  - id: circular-logic-hex
    name: Circular Logic
    players: 2
    group: hex
    world: phobos
    length: short
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 6 }
    # A ring of eight round a two-tile hole, the starts across it.
    layout:
      - ".  7* 8  8"
      - "8  .  .  8"
      - ".  8  8  7*"

  - id: the-great-plan-hex
    name: The Great Plan
    players: 2
    group: hex
    world: deimos
    length: short
    cubes: 7
    stats: { slack: 2, shared: 2, planets: 10 }
    # A void ringed by 8s and 7s; each start sits among three 7s at an end.
    layout:
      - "7  7* 7"
      - "8  7"
      - "8  0  8"
      - "7  8"
      - "7  7* 7"

  - id: critical-density-hex
    name: Critical Density
    players: 3
    group: hex
    world: phobos
    length: long
    cubes: 5
    stats: { slack: 2, shared: 5, planets: 7 }
    # Seven tiles: the starts round an 8, two spaces apart, with 8s between them.
    layout:
      - "9* 8"
      - "8  8  9*"
      - "9* 8"

  - id: edge-of-oblivion-hex
    name: Edge of Oblivion
    players: 3
    group: hex
    world: mars
    length: medium
    cubes: 7
    stats: { slack: 6, shared: 3, planets: 12 }
    # A void ringed by 9s and 8s; each start, out at a point, touches a 9, an 8 and a 7.
    layout:
      - ".  7* 8"
      - "7  9  8  7"
      - ".  8  0  9  7*"
      - "8  9  8  8"
      - ".  7* 7"

  - id: nexus-hex
    name: Nexus
    players: 4
    group: hex
    world: phobos
    length: long
    cubes: 6
    stats: { slack: 6, shared: 5, planets: 12 }
    # Two 10s in the middle with the 7s and 8s round them; two starts touch a 10, two sit further out.
    layout:
      - ".  9*"
      - "8  7  9*"
      - "8  10 10 8"
      - "9* 7  8"
      - ".  .  9*"

  - id: tesseract-hex
    name: Tesseract
    players: 4
    group: hex
    world: deimos
    length: long
    cubes: 6
    stats: { slack: 3, shared: 6, planets: 9 }
    # A 12 (the Skyhook) in the middle, four arms of 8s out to the starts.
    layout:
      - ".  .  7*"
      - ".  .  8"
      - ".  9  9"
      - "7* 8  12 8  7*"
      - ".  9  9"
      - ".  .  8"
      - ".  .  7*"

  # Drift: maps whose planets sit off the middle of their tiles (docs/HEX.md, Off-centre planets), so
  # orbits cross tiles, shrink at the edge and overlap. The seats match under a half-turn (2 or 4 players)
  # or a third-turn (3 players), even as the planets look scattered. Only 7s go off-centre on hex tiles:
  # anything bigger spills over the tile's edge (art OFF_CENTRE).

  - id: twin-drift
    name: Twin Drift
    players: 2
    group: drift
    world: deimos
    length: short
    cubes: 6
    stats: { slack: 6, shared: 2, planets: 10 }
    # Each start shares two orbital spaces with a 7 beside it, and the 9s share two more. Two 7s
    # drift to the map's edge (3 orbital spaces), and two Voids sit between.
    layout:
      - "7se 8*   .    ."
      - "9   0    7n"
      - ".   8    8    ."
      - "7s  0    9"
      - ".   .    8*   7nw"

  - id: circular-drift
    name: Circular Drift
    players: 2
    group: drift
    world: phobos
    length: medium
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 6 }
    # The two 7 starts lean into the ring's central gap, pulling orbits across the other tiles.
    layout:
      - ".  7s* 8  8"
      - "8  .  .  8"
      - ".  8  8  7n*"

  - id: trinary-drift
    name: Trinary Drift
    players: 3
    group: drift
    world: deimos
    length: medium
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 10 }
    # Three 7s drift around a central 10, each turned a third of a turn from the next.
    layout:
      - "8* 7ne  8  8*"
      - "8  10  7s"
      - ".  7nw 8"
      - ".  8*"

  - id: nexus-drift
    name: Nexus Drift
    players: 4
    group: drift
    world: phobos
    length: long
    cubes: 6
    stats: { slack: 6, shared: 5, planets: 12 }
    # Two 7s lean toward the pair of 10s; the other two starts sit further out, as on Nexus.
    layout:
      - ".  9*"
      - "8  7ne  9*"
      - "8  10 10 8"
      - "9* 7sw 8"
      - ".  .  9*"

  # Open ground: hex maps spread out with blank tiles (-), open ground with no planet and no research, among
  # their voids, so the planets stand apart and mechs cross open country between them. Each is the same
  # turned (a half turn, or a third for 3 players).

  - id: arcadia-planitia
    name: Arcadia Planitia
    players: 2
    group: open
    world: mars
    length: medium
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 8 }
    # A hexagon of 19 tiles round a void; each start sits in a corner, on open ground beside a 7.
    layout:
      - ".  7  -  8*"
      - "-  -  7  -"
      - "9  -  0  -  9"
      - "-  7  -  -"
      - ".  8* -  7"

  - id: valles-marineris
    name: Valles Marineris
    players: 2
    group: open
    world: mars
    length: medium
    cubes: 7
    stats: { slack: 6, shared: 4, planets: 10 }
    # A long canyon, the starts at either end, 7 tiles apart, with the 10s in its middle.
    layout:
      - ".  -  8  -  10 -  7"
      - "8* -  7  -  -  7  -  8*"
      - ".  .  7  -  10 -  8  -"

  - id: stickney-crater
    name: Stickney Crater
    players: 3
    group: open
    world: phobos
    length: long
    cubes: 6
    stats: { slack: 3, shared: 3, planets: 9 }
    # A crater floor of blanks and three voids, ringed by 9s and 8s; the starts on the rim, touching a 7 and an 8.
    layout:
      - ".  .  9  -  7  7*"
      - "7* 8  0  -  8"
      - ".  7  -  -  0  9"
      - ".  -  0  -  -"
      - ".  .  9  8  7"
      - ".  .  .  7*"

  - id: tharsis-rise
    name: Tharsis Rise
    players: 3
    group: open
    world: mars
    length: long
    cubes: 6
    stats: { slack: 4, shared: 4, planets: 10 }
    # A 10 on a rise of open ground; each start stands on the slope beside a void and a 7, four tiles from the others.
    layout:
      - ".  .  .  7"
      - ".  8  0  9*"
      - ".  -  -  -  -"
      - "9* -  10 -  8"
      - "7  0  -  -  0"
      - ".  8  -  9* 7"

  - id: utopia-planitia
    name: Utopia Planitia
    players: 4
    group: open
    world: mars
    length: long
    cubes: 6
    stats: { slack: 6, shared: 4, planets: 14 }
    # A void with two 10s across it, on an open plain; the four starts stand out at its edge, each touching a 7
    # and a blank, 4 tiles from two starts and 6 from the one across. The two pairs see different planets nearby.
    layout:
      - ".  .  8*"
      - ".  7  -  9"
      - ".  8  10 -  -  8*"
      - "7  -  0  -  7"
      - "8* -  -  10 8"
      - ".  9  -  7"
      - ".  .  .  8*"

  - id: limtoc
    name: Limtoc
    players: 4
    group: open
    world: phobos
    length: long
    cubes: 6
    stats: { slack: 6, shared: 4, planets: 14 }
    # Two voids side by side across open ground; two starts by a 10, two by a 9 and an 8.
    layout:
      - ".  8* 8  -  7"
      - "7  9  -  10 8*"
      - "-  -  0  0  -  -"
      - "8* 10 -  9  7"
      - ".  7  -  8  8*"

  # Three layouts of opposed starts, central contests and ringed voids.
  # The 2-player map opens long alternate routes to a contested 9; the 3-player map trades its central
  # 10 for a research void and adds a balanced outer ring; the 4-player map turns Nexus's twin central
  # 10s into a shared research corridor and gives every start the same 9.

  - id: elysium-reach
    name: Elysium Reach
    players: 2
    group: hex
    world: mars
    length: short
    cubes: 7
    stats: { slack: 5, shared: 1, planets: 13 }
    # Starts at opposite corners, a 9 between them, and gaps and two voids that break the straight lanes.
    layout:
      - "8* 7  7"
      - "7  .  7  8"
      - ".  0  9  0"
      - "8  7  .  7"
      - ".  .  7  7  8*"

  - id: trinary-wells
    name: Trinary Wells
    players: 3
    group: hex
    world: deimos
    length: short
    cubes: 5
    stats: { slack: 3, shared: 3, planets: 12 }
    layout:
      - "."
      - ".  7"
      - "8* 7  8  8*"
      - "8  0  7"
      - "7  7  8  7"
      - ".  8*"

  - id: hellas-divide
    name: Hellas Divide
    players: 4
    group: hex
    world: phobos
    length: medium
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 12 }
    layout:
      - "7  9*"
      - "8  7  9*"
      - "8  0  0  8"
      - "9* 7  8"
      - ".  .  9* 7"

  # Three further layouts: long lanes, triangular starts and four-arm boards.

  - id: canyon-relay
    name: Canyon Relay
    players: 2
    group: hex
    world: mars
    length: medium
    cubes: 6
    stats: { slack: 6, shared: 3, planets: 9 }
    # A direct lane between equal homes, with a central 10, two 9s and four 7s along the route.
    layout:
      - "8* 7  9  7  10 7  9  7  8*"

  - id: mare-trigonum
    name: Mare Trigonum
    players: 3
    group: hex
    world: phobos
    length: long
    cubes: 6
    stats: { slack: 2, shared: 5, planets: 10 }
    # Equal 9 starts on a triangle, with an 11 (the Mass Driver) in the middle and two 3-fold rings around it.
    layout:
      - "9* 8  7  9*"
      - "7  11 8"
      - ".  8  7"
      - ".  9*"

  - id: fourfold-confluence
    name: Fourfold Confluence
    players: 4
    group: hex
    world: deimos
    length: long
    cubes: 5
    stats: { slack: 3, shared: 6, planets: 13 }
    # Four equal 8 starts on the arms; the 7s make the approach easier and the central 12 (the Skyhook) rewards crossing.
    layout:
      - ".  .  8*"
      - ".  .  8"
      - ".  7  7"
      - "8* 8  12 8  8*"
      - ".  7  7"
      - ".  .  8"
      - ".  .  8*"

  # Five players: a hexagon of 19 tiles can't be turned into fifths, so these are mirror-balanced instead:
  # two pairs of seats that mirror each other and one on the axis. Cubes stay low (4): a fifth player
  # lengthens every round, so each cube costs the table more than it does at two players.

  - id: pentagon-plains
    name: Pentagon Plains
    players: 5
    group: open
    world: mars
    length: long
    cubes: 4
    stats: { slack: 4, shared: 4, planets: 12 }
    # A 10 in the middle of a ring of open ground; five 8 starts round the hexagon's rim, the 9s between pairs of them, and a void.
    layout:
      - ".  8* 7  8*"
      - "7  -  -  9"
      - "8* -  10 -  7"
      - "9  -  -  8*"
      - ".  7  8* 0"

  - id: ouroboros
    name: Ouroboros
    players: 5
    group: hex
    world: deimos
    length: medium
    cubes: 4
    stats: { slack: 5, shared: 5, planets: 12 }
    # A ring of twelve round an empty middle, a start every two or three tiles; two starts share a 9 between them.
    layout:
      - ".  8* 8  8*"
      - "8  .  .  7"
      - "8* .  .  .  9"
      - "7  .  .  8*"
      - ".  9  8* 9"

  - id: crescent-bay
    name: Crescent Bay
    players: 5
    group: open
    world: phobos
    length: medium
    cubes: 4
    stats: { slack: 2, shared: 6, planets: 12 }
    # Five of the hexagon's six corners hold starts; the sixth is a bay of open ground, with an 11 (the Mass Driver) in the middle.
    layout:
      - ".  8* 7  8*"
      - "7  -  0  7"
      - "8* -  11 -  8*"
      - "9  0  -  7"
      - ".  -  9  8*"

  # Lower cube counts for the bigger tables. A cube is a claim, and a claim takes a turn or two of manoeuvring
  # (more with more mechs in the way), so the game's length goes with the cubes times the players: these maps
  # ask 5 of two players, 5 or 4 of three, 4 of four.

  - id: olympus-mons
    name: Olympus Mons
    players: 2
    group: open
    world: mars
    length: short
    cubes: 5
    stats: { slack: 6, shared: 1, planets: 9 }
    # A 10 on the summit between two voids, an 8 and a 7 beside each start; the half turn matches the seats.
    layout:
      - ".  8* 7  8"
      - "7  0  -  -"
      - "-  -  10 -  -"
      - "-  -  0  7"
      - ".  8  7  8*"

  - id: triple-junction
    name: Triple Junction
    players: 3
    group: hex
    world: phobos
    length: short
    cubes: 4
    stats: { slack: 6, shared: 2, planets: 9 }
    # A void ringed by 7s and 8s in turn, a 9 start at each of three corners, a third of a turn apart.
    layout:
      - "9* 8  7  9*"
      - "7  0  8"
      - ".  8  7"
      - ".  9*"

  - id: cydonia
    name: Cydonia
    players: 4
    group: hex
    world: mars
    length: medium
    cubes: 4
    stats: { slack: 2, shared: 4, planets: 10 }
    # Four 8 starts at the corners of a diamond, a void between them and a pair of 9s on its long diagonal.
    layout:
      - ".  .  8*"
      - ".  7  7"
      - "8* 9  0  9  8*"
      - ".  7  7"
      - ".  .  8*"

  # Prepared ground: the ground starts broken. An Ice Tunnel or barriers are on the map before the first
  # turn, laid symmetrically, so the seats stay level. The shape of the fight comes from them: a tunnel's
  # mouths are where raiders appear, a barrier line is a pass to hold.

  - id: ice-run
    name: Ice Run
    players: 2
    group: prepared
    world: deimos
    length: medium
    cubes: 6
    stats: { slack: 6, shared: 3, planets: 7 }
    # A long lane like Canyon Relay, but an Ice Tunnel is open between its two 9s, past the central 10.
    start:
      tunnel: ["0:2:s", "0:6:n"]
    layout:
      - "7* 8  9  7  10 7  9  8  7*"

  - id: rubble-field
    name: Rubble Field
    players: 3
    group: prepared
    world: mars
    length: medium
    cubes: 4
    stats: { slack: 6, shared: 2, planets: 9 }
    # Triple Junction with nine barriers laid in threes, a third of a turn apart, that wall each pair of starts off from the other: the walk between homes goes from 7 spaces to 12, round the rubble.
    start:
      barriers: ["0:2:n", "2:2:se", "1:0:sw", "1:2:n", "2:1:se", "0:1:sw", "0:2:se", "2:2:sw", "1:0:n"]
    layout:
      - "9* 8  7  9*"
      - "7  0  8"
      - ".  8  7"
      - ".  9*"

  - id: two-arcs
    name: Two Arcs
    players: 2
    group: prepared
    world: phobos
    length: short
    cubes: 4
    stats: { slack: 2, shared: 2, planets: 4 }
    # Circular Logic cut in two: each start has an arc of three objectives to itself, and only the wormhole crosses the gap. No arc has the four a player's cubes need, so one must be planted across.
    start:
      wormhole: ["0:2:s", "2:2:n"]
    layout:
      - ".  7* 8  8"
      - ".  .  .  ."
      - ".  8  8  7*"

  - id: crater-rim
    name: Crater Rim
    players: 2
    group: prepared
    world: mars
    length: short
    cubes: 5
    stats: { slack: 6, shared: 1, planets: 9 }
    # Olympus Mons with a rim of barriers round its summit 10, two one-space breaches. The 10 is a fort: whoever holds the breaches holds the claim.
    start:
      barriers:
        ["1:1:se", "3:2:nw", "1:2:sw", "3:1:ne", "1:1:s", "3:2:n", "2:3:nw", "2:1:se", "2:1:ne", "2:3:sw"]
    layout:
      - ".  8* 7  8"
      - "7  0  -  -"
      - "-  -  10 -  -"
      - "-  -  0  7"
      - ".  8  7  8*"

  - id: moon-crater
    name: Moon Crater
    players: 3
    group: prepared
    world: phobos
    length: medium
    cubes: 5
    stats: { slack: 5, shared: 3, planets: 10 }
    # Mare Trigonum with a rim of barriers round its central 11 and three one-space breaches, each facing a start's side.
    start:
      barriers:
        ["0:1:se", "1:2:sw", "2:1:n", "0:2:sw", "2:2:n", "1:0:se", "0:1:s", "1:2:nw", "2:1:ne"]
    layout:
      - "9* 8  7  9*"
      - "7  11 8"
      - ".  8  7"
      - ".  9*"

  - id: switchback
    name: Switchback
    players: 2
    group: prepared
    world: deimos
    length: short
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    # Alpha Sector with two broken walls across it, each a pair of 7s with two barriers between and gaps at both ends. The walk between the starts is 10 spaces, through the chamber with the 8.
    start:
      barriers: ["1:0:se", "1:1:nw", "3:1:nw", "3:0:se"]
    layout:
      - ".  7*"
      - "7  7"
      - "7  8  7"
      - "7  7"
      - ".  7*"

  - id: ice-bridge
    name: Ice Bridge
    players: 4
    group: prepared
    world: deimos
    length: long
    cubes: 4
    stats: { slack: 0, shared: 6, planets: 8 }
    # Cydonia cut across its void into two islands of two starts each; the wormhole is the only way over, and each island has too few objectives for its players' cubes.
    start:
      wormhole: ["2:1:se", "2:3:nw"]
    layout:
      - ".  .  8*"
      - ".  7  ."
      - "8* 9  .  9  8*"
      - ".  .  7"
      - ".  .  8*"
