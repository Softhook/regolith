# Regolith's map layouts
#
# A map is a layout of hex tiles: 7-hex flowers, the planet and the six spaces around it, so all six
# spaces of a tile are its planet's orbit. A layout is read as rows of tiles where each odd row (the
# 2nd, 4th…) sits half a tile to the right, between the tiles of the rows above and below: a tile
# touches the two tiles beside it and two in each neighbouring row (docs/HEX.md).
#
# Layout tokens (space-separated, one string per tile row):
#   7 | 8 | 9 | 10   planet tile; number = conquer target and cube locations (7→1, 8→2, 9→3, 10→4)
#   0                void tile: no planet; +1 research per own ship on it at start of turn
#   -                blank tile: open ground, no planet and no research
#   .                no tile (empty gap, not part of the board)
#   suffix n ne se s sw nw
#                    the planet sits off the middle of its tile, on that hex (north is up as drawn)
#   suffix *         starting planet, after any direction: 8*, 7ne*
#
# An off-centre planet's orbit is still the spaces next to it, so it reaches onto the tiles it faces,
# loses spaces off the map's edge, and may overlap another planet's: a ship there counts for both. Each
# starting planet needs 3 orbital spaces no other start shares.
#
# Groups: hex (the basic and advanced maps), open (maps spread out with blank tiles),
#         drift (planets off the middle of their tiles).
#
# world: phobos | deimos | mars, on every map. The surface the map lies on, which its tiles show. Phobos is
#   grey and cratered; Deimos, the outer moon, redder and smoother, its craters buried under dust; Mars has
#   dunes and dust devils' tracks.
#
# Stats, all derivable from layout + cubes + player count (mapStats(), kept in step by maps.test.ts):
#   slack   = total cube locations − players × cubes
#   planets = planets that still have an empty location after setup
#   shared  = how many of those must be shared if everyone placed all their cubes

maps:
  - id: alpha-hex
    name: Alpha Sector
    players: 2
    group: hex
    world: phobos
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    layout:
      - ".  7*"
      - "7  7"
      - "7  8  7"
      - "7  7"
      - ".  7*"

  - id: beta-hex
    name: Beta Sector
    players: 3
    group: hex
    world: deimos
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 10 }
    layout:
      - "8* 7  8  8*"
      - "8  10 7"
      - ".  7  8"
      - ".  8*"

  - id: gamma-hex
    name: Gamma Sector
    players: 4
    group: hex
    world: phobos
    cubes: 5
    stats: { slack: 4, shared: 5, planets: 9 }
    layout:
      - ".  9*"
      - "9  8"
      - "8* 10 8*"
      - "8  9"
      - ".  9*"

  # Hex: advanced maps, each with an idea (where the starts sit, what they touch, a void or a gap in the middle).
  # Their seats match by a half turn (a third of a turn for 3 players), as hex maps can't be mirrored.

  - id: terra-minor-hex
    name: Terra Minor
    players: 2
    group: hex
    world: mars
    cubes: 7
    stats: { slack: 0, shared: 6, planets: 6 }
    # A band of six 8s, a start at each end touching two of them.
    layout:
      - "8  8"
      - "7* 8  8  7*"
      - ".  8  8"

  - id: circular-logic-hex
    name: Circular Logic
    players: 2
    group: hex
    world: phobos
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 6 }
    # A ring of eight round a two-tile hole, the starts across it.
    layout:
      - ".  7* 8  8"
      - "8  .  .  8"
      - ".  8  8  7*"

  - id: the-great-plan-hex
    name: The Great Plan
    players: 2
    group: hex
    world: deimos
    cubes: 7
    stats: { slack: 2, shared: 2, planets: 10 }
    # A void ringed by 8s and 7s; each start sits among three 7s at an end.
    layout:
      - "7  7* 7"
      - "8  7"
      - "8  0  8"
      - "7  8"
      - "7  7* 7"

  - id: critical-density-hex
    name: Critical Density
    players: 3
    group: hex
    world: phobos
    cubes: 5
    stats: { slack: 2, shared: 5, planets: 7 }
    # Seven tiles: the starts round an 8, two spaces apart, with 8s between them.
    layout:
      - "9* 8"
      - "8  8  9*"
      - "9* 8"

  - id: edge-of-oblivion-hex
    name: Edge of Oblivion
    players: 3
    group: hex
    world: mars
    cubes: 7
    stats: { slack: 6, shared: 3, planets: 12 }
    # A void ringed by 9s and 8s; each start, out at a point, touches a 9, an 8 and a 7.
    layout:
      - ".  7* 8"
      - "7  9  8  7"
      - ".  8  0  9  7*"
      - "8  9  8  8"
      - ".  7* 7"

  - id: nexus-hex
    name: Nexus
    players: 4
    group: hex
    world: phobos
    cubes: 6
    stats: { slack: 6, shared: 5, planets: 12 }
    # Two 10s in the middle with the 7s and 8s round them; two starts touch a 10, two sit further out.
    layout:
      - ".  9*"
      - "8  7  9*"
      - "8  10 10 8"
      - "9* 7  8"
      - ".  .  9*"

  - id: tesseract-hex
    name: Tesseract
    players: 4
    group: hex
    world: deimos
    cubes: 6
    stats: { slack: 4, shared: 5, planets: 9 }
    # A 10 in the middle, four arms of 8s out to the starts.
    layout:
      - ".  .  7*"
      - ".  .  8"
      - ".  9  9"
      - "7* 8  10 8  7*"
      - ".  9  9"
      - ".  .  8"
      - ".  .  7*"

  # Drift: maps whose planets sit off the middle of their tiles (docs/HEX.md, Off-centre planets), so
  # orbits cross tiles, shrink at the edge and overlap. The seats match under a half-turn (2 or 4 players)
  # or a third-turn (3 players), even as the planets look scattered. Only 7s go off-centre on hex tiles:
  # anything bigger spills over the tile's edge (art OFF_CENTRE).

  - id: twin-drift
    name: Twin Drift
    players: 2
    group: drift
    world: deimos
    cubes: 6
    stats: { slack: 6, shared: 2, planets: 10 }
    # Each start shares two orbital spaces with a 7 beside it, and the 9s share two more. Two 7s
    # drift to the map's edge (3 orbital spaces), and two Voids sit between.
    layout:
      - "7se 8*   .    ."
      - "9   0    7n"
      - ".   8    8    ."
      - "7s  0    9"
      - ".   .    8*   7nw"

  - id: circular-drift
    name: Circular Drift
    players: 2
    group: drift
    world: phobos
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 6 }
    # The two 7 starts lean into the ring's central gap, pulling orbits across the other tiles.
    layout:
      - ".  7s* 8  8"
      - "8  .  .  8"
      - ".  8  8  7n*"

  - id: trinary-drift
    name: Trinary Drift
    players: 3
    group: drift
    world: deimos
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 10 }
    # Three 7s drift around a central 10, each turned a third of a turn from the next.
    layout:
      - "8* 7ne  8  8*"
      - "8  10  7s"
      - ".  7nw 8"
      - ".  8*"

  - id: nexus-drift
    name: Nexus Drift
    players: 4
    group: drift
    world: phobos
    cubes: 6
    stats: { slack: 6, shared: 5, planets: 12 }
    # Two 7s lean toward the pair of 10s; the other two starts sit further out, as on Nexus.
    layout:
      - ".  9*"
      - "8  7ne  9*"
      - "8  10 10 8"
      - "9* 7sw 8"
      - ".  .  9*"

  # Open ground: hex maps spread out with blank tiles (-), open ground with no planet and no research, among
  # their voids, so the planets stand apart and mechs cross open country between them. Each is the same
  # turned (a half turn, or a third for 3 players).

  - id: arcadia-planitia
    name: Arcadia Planitia
    players: 2
    group: open
    world: mars
    cubes: 6
    stats: { slack: 2, shared: 4, planets: 8 }
    # A hexagon of 19 tiles round a void; each start sits in a corner, on open ground beside a 7.
    layout:
      - ".  7  -  8*"
      - "-  -  7  -"
      - "9  -  0  -  9"
      - "-  7  -  -"
      - ".  8* -  7"

  - id: valles-marineris
    name: Valles Marineris
    players: 2
    group: open
    world: mars
    cubes: 7
    stats: { slack: 6, shared: 4, planets: 10 }
    # A long canyon, the starts at either end, 7 tiles apart, with the 10s in its middle.
    layout:
      - ".  -  8  -  10 -  7"
      - "8* -  7  -  -  7  -  8*"
      - ".  .  7  -  10 -  8  -"

  - id: stickney-crater
    name: Stickney Crater
    players: 3
    group: open
    world: phobos
    cubes: 6
    stats: { slack: 3, shared: 3, planets: 9 }
    # A crater floor of blanks and three voids, ringed by 9s and 8s; the starts on the rim, touching a 7 and an 8.
    layout:
      - ".  .  9  -  7  7*"
      - "7* 8  0  -  8"
      - ".  7  -  -  0  9"
      - ".  -  0  -  -"
      - ".  .  9  8  7"
      - ".  .  .  7*"

  - id: tharsis-rise
    name: Tharsis Rise
    players: 3
    group: open
    world: mars
    cubes: 6
    stats: { slack: 4, shared: 4, planets: 10 }
    # A 10 on a rise of open ground; each start stands on the slope beside a void and a 7, four tiles from the others.
    layout:
      - ".  .  .  7"
      - ".  8  0  9*"
      - ".  -  -  -  -"
      - "9* -  10 -  8"
      - "7  0  -  -  0"
      - ".  8  -  9* 7"

  - id: utopia-planitia
    name: Utopia Planitia
    players: 4
    group: open
    world: mars
    cubes: 6
    stats: { slack: 6, shared: 4, planets: 14 }
    # A void with two 10s across it, on an open plain; the four starts stand out at its edge, each touching a 7
    # and a blank, 4 tiles from two starts and 6 from the one across. The two pairs see different planets nearby.
    layout:
      - ".  .  8*"
      - ".  7  -  9"
      - ".  8  10 -  -  8*"
      - "7  -  0  -  7"
      - "8* -  -  10 8"
      - ".  9  -  7"
      - ".  .  .  8*"

  - id: limtoc
    name: Limtoc
    players: 4
    group: open
    world: phobos
    cubes: 6
    stats: { slack: 6, shared: 4, planets: 14 }
    # Two voids side by side across open ground; two starts by a 10, two by a 9 and an 8.
    layout:
      - ".  8* 8  -  7"
      - "7  9  -  10 8*"
      - "-  -  0  0  -  -"
      - "8* 10 -  9  7"
      - ".  7  -  8  8*"

  # Three layouts of opposed starts, central contests and ringed voids.
  # The 2-player map opens long alternate routes to a contested 9; the 3-player map trades its central
  # 10 for a research void and adds a balanced outer ring; the 4-player map turns Nexus's twin central
  # 10s into a shared research corridor and gives every start the same 9.

  - id: elysium-reach
    name: Elysium Reach
    players: 2
    group: hex
    world: mars
    cubes: 7
    stats: { slack: 5, shared: 1, planets: 13 }
    # Starts at opposite corners, a 9 between them, and gaps and two voids that break the straight lanes.
    layout:
      - "8* 7  7"
      - "7  .  7  8"
      - ".  0  9  0"
      - "8  7  .  7"
      - ".  .  7  7  8*"

  - id: trinary-wells
    name: Trinary Wells
    players: 3
    group: hex
    world: deimos
    cubes: 5
    stats: { slack: 3, shared: 3, planets: 12 }
    layout:
      - "."
      - ".  7"
      - "8* 7  8  8*"
      - "8  0  7"
      - "7  7  8  7"
      - ".  8*"

  - id: hellas-divide
    name: Hellas Divide
    players: 4
    group: hex
    world: phobos
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 12 }
    layout:
      - "7  9*"
      - "8  7  9*"
      - "8  0  0  8"
      - "9* 7  8"
      - ".  .  9* 7"

  # Three further layouts: long lanes, triangular starts and four-arm boards.

  - id: canyon-relay
    name: Canyon Relay
    players: 2
    group: hex
    world: mars
    cubes: 6
    stats: { slack: 6, shared: 3, planets: 9 }
    # A direct lane between equal homes, with a central 10, two 9s and four 7s along the route.
    layout:
      - "8* 7  9  7  10 7  9  7  8*"

  - id: mare-trigonum
    name: Mare Trigonum
    players: 3
    group: hex
    world: phobos
    cubes: 6
    stats: { slack: 4, shared: 4, planets: 10 }
    # Equal 9 starts on a triangle, with a 10 in the middle and two 3-fold rings around it.
    layout:
      - "9* 8  7  9*"
      - "7  10 8"
      - ".  8  7"
      - ".  9*"

  - id: fourfold-confluence
    name: Fourfold Confluence
    players: 4
    group: hex
    world: deimos
    cubes: 5
    stats: { slack: 4, shared: 5, planets: 13 }
    # Four equal 8 starts on the arms; the 7s make the approach easier and the central 10 rewards crossing.
    layout:
      - ".  .  8*"
      - ".  .  8"
      - ".  7  7"
      - "8* 8  10 8  8*"
      - ".  7  7"
      - ".  .  8"
      - ".  .  8*"
